version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ../.env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
